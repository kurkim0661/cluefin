[project]
name = "cluefin-agent"
version = "0.1.0"
description = "LangGraph daily market research agent for Cluefin"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "cluefin-store",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "pydantic>=2.12.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
cluefin-agent = "cluefin_agent.cli:cli"

[tool.ruff]
extend = "../../pyproject.toml"
include = ["src/**", "tests/**"]
